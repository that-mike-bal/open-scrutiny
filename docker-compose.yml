# Local two-service stack: FastAPI/CrewAI backend + React frontend (nginx).
# Credentials come from your .env (see env.example); nothing is read from files.
#
#   cp env.example .env && docker compose up --build
#   backend  -> http://localhost:8000
#   frontend -> http://localhost:8080

services:
  backend:
    build:
      context: .
      dockerfile: crewai_service/Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - DEBUG_MODE=${DEBUG_MODE:-false}
      - CORS_ALLOW_ORIGINS=${CORS_ALLOW_ORIGINS:-http://localhost:8080,http://localhost:5173}
    volumes:
      - ./data:/app/data:ro
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        - VITE_SUPABASE_URL=${VITE_SUPABASE_URL:-}
        - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY:-}
        - VITE_CREWAI_ENDPOINT=${VITE_CREWAI_ENDPOINT:-http://localhost:8000}
        - VITE_FRONTEND_URL=${VITE_FRONTEND_URL:-http://localhost:8080}
        - VITE_DEV_MODE=${VITE_DEV_MODE:-false}
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
