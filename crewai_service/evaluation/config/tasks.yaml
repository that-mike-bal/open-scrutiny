cultural_linguistic_assessment:
  description: |
    Assess TLD string '{tld_string}' for cultural sensitivities and language conflicts across major global languages.

    Conduct comprehensive cultural analysis:
    1. Etymology Analysis: Research the word origin, root language, and historical meaning evolution across cultures
    2. Check for alternative spellings, translations, and variations of the string in major languages for example "kind" in English has a totally different meaning in German.
    3. Cross-Language Relevance: List meanings and significance in major global languages (English, Spanish, French, German, Russian, Arabic, Chinese, Japanese, Hindi, Portuguese) even if not concerning
    4. Check for Cultural Sensitivity Screening (religious, political, social taboos) where the string may have a unique meaning to the cultural group, even without an official alternate meaning in another language.
    5. Historical Context Analysis (conflicts, sensitivities, oppression references)
    6. Regional Variation Assessment (different meanings by geographic region)
    7. Script Conflict Analysis (visual similarity issues across writing systems)
    8. Homophone and False Friend Detection (sounds like or means problematic words)

    Use comprehensive cultural and linguistic knowledge to identify potential issues across:
    - Religious terms or sacred words that could cause offense
    - Cultural slurs or terms considered offensive in any major culture
    - Political or ideological conflicts and sensitive terminology
    - Historical sensitivity related to wars, conflicts, or oppression
    - Social taboos or controversial topics in different societies
    - Translation issues where innocent words become problematic in other languages
    - Visual script conflicts in different writing systems

    🔧 **ENHANCED TOOL USAGE**:
    - Use "Web Search for GAC Risk Analysis" to search for recent cultural developments and sensitivities (search terms like "TLD cultural sensitivity", "TLD controversy", "TLD religious concerns")
    - Search for recent news about cultural conflicts, religious sensitivities, or social controversies related to the string
    - Use "Advanced String Similarity Analyzer" results to identify similar strings that might have cultural or linguistic implications
    - Use "ICANN Guidebook Search" for official guidance on cultural sensitivity requirements

    **ENHANCED APPROACH**:
    - **Conservative Cultural Assessment**: When uncertain about cultural implications, flag for cultural review
    - **Recent Events Integration**: Use web search to identify current cultural developments that might affect string perception
    - **Similarity Context**: Reference similarity analysis to understand potential conflicts with existing culturally sensitive terms
    - **Multi-Language Analysis**: Consider cultural implications across all major world languages and writing systems

    Apply conservative cultural assessment - when in doubt, flag for cultural review.
  expected_output: |
    Cultural and linguistic risk assessment with STRUCTURED SCORING:

    ## Etymology & Cross-Language Context
    **Etymology:** [Word origin, root language, historical evolution]
    **Cross-Language Meanings:** [List meanings and significance in major languages, even non-concerning ones]

    ## Language Analysis
    ```json
    "language_assessment": {
        "en_lang": {"score": 0, "issues": []},
        "french": {"score": 0, "issues": []},
        "spanish": {"score": 1, "issues": ["minor_slang_concern"]},
        "russian": {"score": 0, "issues": []},
        "arabic": {"score": 0, "issues": []},
        "chinese": {"score": 0, "issues": []}
    }
    ```

    ## Cultural Sensitivity Analysis
    ```json
    "cultural_assessment": {
        "religious_concerns": [],
        "political_sensitivities": [],
        "social_taboos": [],
        "historical_conflicts": [],
        "overall_score": 1
    }
    ```

    ## Script and Visual Conflicts
    - Visual Similarity Issues: [List any problematic visual similarities]
    - Script Conflicts: [Issues with different writing systems]
    - Homophone Conflicts: [Sounds like problematic words]

    ## Regional Risk Assessment
    - North America: [Cultural risk level and specific concerns]
    - Europe: [Cultural risk level and specific concerns]
    - Asia-Pacific: [Cultural risk level and specific concerns]
    - Middle East/Africa: [Cultural risk level and specific concerns]
    - Latin America: [Cultural risk level and specific concerns]

    ## Overall Risk Assessment
    - Cultural Risk Score: [0-5 scale]
    - Language Conflict Score: [0-5 scale]
    - Overall Cultural/Linguistic Risk: [NONE/LOW/MODERATE/HIGH/CRITICAL]
    - Confidence Level: [HIGH/MEDIUM/LOW]

    ## Recommended Mitigations
    - Specific cultural sensitivity measures required
    - Geographic restrictions to consider if any
    - Community engagement strategies for sensitive regions
    - Marketing and communication guidelines to avoid cultural issues

    ## Geographic Restrictions Recommended
    - Regions to avoid: [specific countries/regions if cultural conflicts identified]
    - Alternative positioning strategies for sensitive markets
    - Cultural adaptation requirements for global deployment
  agent: gac_advisor
  context_consumer: []
  context_producer:
  - cultural_risk_factors
  - linguistic_assessment
  output_file: evaluation_reports/cultural_assessment_{tld_string}.md
  create_directory: true

