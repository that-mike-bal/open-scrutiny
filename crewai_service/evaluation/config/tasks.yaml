# ---- LEGAL RISK ASSESSMENT ----------------------------------------------

deep_research_legal_assessment:
  description: |
    Conduct comprehensive legal and intellectual property risk research for '{tld_string}'
    using the Deep Research Legal Analyzer tool. This single tool call covers trademarks,
    patents, and broader IP risks with cited web sources.

    Call the "Deep Research Legal Analyzer" with the TLD string, then analyze the returned report.
    Organize findings by: trademark conflicts (by jurisdiction), patent conflicts, and broader legal risks.

    CRITICAL — TRADEMARK ANALYSIS NUANCE:
    A word matching the TLD string is NOT, by itself, a meaningful conflict. When analyzing each
    trademark hit, evaluate the REALISTIC likelihood that it would actually pose a problem for
    the gTLD application, not just whether the text matches. For every match, weigh:
      - Is the holder an active, operating business (not defunct or dissolved)?
      - Does the holder operate in technology, internet, DNS, software, digital services, or
        online commerce — i.e., a space where a TLD would plausibly cause confusion or harm?
      - Do the Nice classes overlap with DNS/internet-relevant ones (9, 35, 38, 41, 42)?
      - Is the mark famous or commercially used, or obscure/defensively parked?
      - Does the holder have any trademark enforcement or LRO/UDRP history?
      - Is the match identical, or merely similar/partial/phonetic?

    Flag STRONG conflicts (and overall HIGH/CRITICAL risk) for matches held by active, relevant,
    enforcing holders. Flag MEDIUM conflicts for active holders with a plausible but less obvious
    reason to object — these should still contribute to a MEDIUM or HIGH overall rating,
    especially if multiple MEDIUM matches exist. Classify as WEAK (and exclude from the overall
    rating) any pure textual matches held by defunct entities, clearly unrelated industries, or
    abandoned registrations.

    The objective is to avoid over-flagging meaningless word matches while still catching every
    genuine risk. When in doubt between two adjacent levels, choose the more conservative one
    and explain why. Classify the overall legal risk level and identify the most concerning issues,
    explicitly citing the qualitative factors (not just the count of matches) that drove the rating.
  expected_output: |
    # Deep Research Legal Assessment: .{tld_string}

    **STATUS:** LOW RISK / MEDIUM RISK / HIGH RISK / CRITICAL

    ## RESEARCH METHODOLOGY
    - **Research Tool**: Gemini Deep Research Legal Analyzer
    - **Sources Searched**: USPTO, EUIPO, WIPO trademark databases; USPTO patents; web legal sources
    - **Research Duration**: [duration from tool response]
    - **Sources Cited**: [count from tool response]

