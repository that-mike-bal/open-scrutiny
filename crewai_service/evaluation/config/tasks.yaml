    REQUIRED SCORING STRUCTURE:
    1. Evaluate against ICANN safeguard criteria (Q175-Q180)
    2. Determine required safeguard groups (1-4)
    3. Assign numerical GAC risk score (1.0-5.0)
    4. Identify specific safeguard requirements

    For each ICANN safeguard question (Q175–Q180), provide:
    - A Yes / No / Maybe answer
    - 1–2 sentence rationale with specific examples
    - Consider meanings in multiple languages and cultural contexts

