# ---- POLICY SAFEGUARD REVIEW --------------------------------------------

geographic_name_assessment:
  description: |
    Determine whether TLD string '{tld_string}' represents a geographic location requiring government approval with structured classification.

    GEOGRAPHIC NAME EVALUATION:
    Assess if string represents any of these ICANN-defined geographic categories:

    **Type 1 - Country/Territory Names:**
    - Exact matches to ISO 3166-1 country names (short/long form, English/local language)
    - Territory names from ISO 3166-1 list
    - Permutations (spaces removed, punctuation, articles like "the")

    **Type 2 - Capital Cities:**
    - Capital cities listed in ISO 3166-1
    - Major administrative centers

    **Type 3 - City Names:**
    - Where applicant declares intent to use TLD for city-associated purposes
    - Clear from application statements that TLD primarily for city name purposes
    - String matches official city documents

    **Type 4 - Sub-national Places:**
    - Counties, provinces, states from ISO 3166-2
    - UNESCO regions (Africa, Arab States, Asia-Pacific, Europe-North America, Latin America-Caribbean)
    - UN M49 geographic regions

    **Translation & Variant Analysis:**
    - Check major language translations and transliterations
    - Consider cultural name variations and historical designations
    - Assess phonetic similarities in major languages

    **Government Approval Assessment:**
    If geographic name identified, determine:
    - Which government authorities would be relevant
    - Whether support/non-objection documentation required
    - Special requirements (60% rule for regions, multiple jurisdictions)

    🔧 **ENHANCED TOOL USAGE**:
    - Use "ICANN Guidebook Search" to reference official ICANN guidance on geographic names
    - Search for relevant sections like "Geographic Names", "Country Names", "Government Approval", "ISO 3166"
    - Use "Web Search for GAC Risk Analysis" to search for recent political developments (search terms like "TLD geographic concerns", "TLD government approval", "TLD political sensitivity")
    - Search for recent news about territorial disputes, government changes, or political sensitivities related to the string
    - Use "Advanced String Similarity Analyzer" results to identify similar geographic names that might cause confusion

    **ENHANCED APPROACH**:
    - **Conservative Assessment**: When uncertain about geographic classification, flag for expert review
    - **Recent Events Integration**: Use web search to identify current political developments affecting geographic names
    - **Similarity Context**: Reference similarity analysis to understand potential confusion with existing geographic TLDs

    Apply conservative assessment - when uncertain, flag for expert review.
