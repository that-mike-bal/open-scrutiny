# `description` is the instruction the agent follows and its `expected_output`
# is the rubric-shaped report it must produce. Rewrite these for your domain.
# This platform is a domain-agnostic evaluate-then-generate engine; the
# gTLD/ICANN ruleset is just the bundled example. Grep for 'CUSTOMIZE:'
# to find every retargeting point. See the README's Customize section.
#
# Inputs available for substitution: {tld_string}, {use_case}
# (see crewai_service/app.py run_sequential_workflows). Only these two
# placeholders are substituted; other braces are left untouched.
# ==========================================================================


# ---- TECHNICAL RISK ASSESSMENT ------------------------------------------

dns_stability_review:
  description: |
    Perform comprehensive DNS stability and technical compliance validation for '{tld_string}' using efficient two-tier approach.

    **TIER 1 - BASIC TECHNICAL COMPLIANCE (Fast):**
    1. **Character Length Check**: Verify 3-63 characters
    2. **ASCII Validation**: Ensure only valid ASCII characters (a-z, 0-9, hyphen)
    3. **Hyphen Position Rules**: No hyphens in 3rd/4th positions, no start/end hyphens
    4. **Numeric Check**: Cannot be all numeric
    5. **Basic Standards Compliance**: Flag obvious technical violations

    **TIER 2 - DNS STABILITY ANALYSIS (If Tier 1 passes):**

    **6. Root Zone Label Generation Rules (RZ-LGR) Validation:**
    - Check for script mixing (different writing systems in one string)
    - Validate character variants and confusables
    - Ensure no prohibited code points
    - Flag any non-ASCII for IDN expert review

    **7. RFC Standards Compliance Assessment:**
    - **RFC 1035**: Verify DNS name syntax rules, case-insensitive handling
    - **RFC 1123**: Confirm host name requirements, relaxed syntax rules
    - **RFC 2181**: Check DNS specification compliance, name length limits
    - Use TLD String Analyzer tool for specific RFC validation

    **8. Protocol Compatibility Analysis:**
    - Assess DNS resolution compatibility across major DNS software
    - Check for potential parsing issues in DNS queries/responses
    - Evaluate compatibility with DNS security extensions (DNSSEC)
    - Flag any string patterns that might cause resolver issues

    **9. Character Encoding Validation:**
    - Confirm proper UTF-8 encoding for international characters
    - Validate ASCII subset compliance for basic strings
    - Check for normalization issues (NFC, NFD, NFKC, NFKD)
    - Flag mixed scripts or complex Unicode for expert review

    **TIER 2 EXECUTION APPROACH:**
    1. **Use TLD String Analyzer** first for comprehensive technical analysis
    2. **Reference ICANN Guidebook** for official criteria and edge cases
    3. **Apply conservative assessment** - when in doubt, flag for expert review
    4. **Focus on practical DNS deployment** - will this work in real DNS infrastructure?

    **For non-ASCII strings**: Flag for expert IDN review rather than attempting complex validation.

    🔧 **DETAILED TOOL USAGE**:
    - **TLD String Analyzer**: Primary tool for technical compliance validation
      - Call with tld_string parameter for comprehensive analysis
      - Extract specific RFC compliance results
      - Use character analysis and risk assessment features

    - **ICANN Guidebook Search**: Reference official guidance
      - Search "DNS Stability Review" for evaluation criteria
      - Search "Root Zone Label Generation Rules" for RZ-LGR requirements
      - Search "Technical Requirements" for RFC compliance standards
      - Search "Internationalized Domain Names" for non-ASCII handling

    **FOCUS**: Reliable, tool-driven validation with specific actionable checks for each component.
  expected_output: |
    # 🛡️ DNS Stability & Technical Compliance Assessment: .{tld_string}

    **STATUS:** ✅ PASS / ⚠️ FLAGGED / ❌ BLOCKED

    ## **🔍 ANALYSIS APPROACH**

    ### **Two-Tier Validation Methodology**
    I conducted a comprehensive DNS stability assessment using a two-tier approach designed to efficiently identify both basic compliance issues and advanced stability concerns.

    **My Assessment Process:**
    1. **Tier 1 - Basic Technical Compliance**: Rapid validation of fundamental DNS requirements
    2. **Tier 2 - DNS Stability Analysis**: In-depth technical compliance and stability assessment
    3. **RFC Standards Validation**: Verification against DNS specification requirements
    4. **Expert Review Determination**: Conservative flagging for complex cases requiring specialist review

    ### **Tools and Data Sources Used**
    - **TLD String Analyzer**: Primary tool for comprehensive technical validation
    - **ICANN Guidebook Search**: Referenced official DNS stability criteria and requirements
    - **RFC Compliance Database**: Validated against DNS specification standards
    - **Root Zone Label Generation Rules**: Checked for character and script compliance

    ## **📊 OVERALL ASSESSMENT RESULTS**

    ### **Final Technical Compliance Status**
    - **Overall Status**: ✅ PASS / ⚠️ FLAGGED / ❌ BLOCKED
    - **Tier 1 (Basic Compliance)**: ✅ PASS / ❌ FAIL
    - **Tier 2 (Stability Analysis)**: ✅ PASS / ⚠️ FLAGGED / ❌ FAIL / ➡️ SKIPPED
    - **Expert Review Required**: Yes/No
    - **ICANN Application Ready**: Yes/No

    ## **🔍 TIER 1 - BASIC TECHNICAL COMPLIANCE**

    ### **Character-Level Validation Results**

    **Length Validation**
    - **Result**: ✅ PASS / ❌ FAIL
    - **String Length**: [X] characters
    - **Requirement**: 3-63 characters (DNS standard)
    - **Analysis**: [Detailed explanation of length compliance]

    **ASCII Character Compliance**
    - **Result**: ✅ PASS / ⚠️ IDN_REVIEW_REQUIRED / ❌ INVALID_CHARS
    - **Character Set**: [Analysis of characters used]
    - **Findings**: [Detailed explanation of character compliance]
    - **IDN Considerations**: [Any non-ASCII character implications]

    **Hyphen Position Rules**
    - **Result**: ✅ PASS / ❌ VIOLATION
    - **Rules Checked**: No start/end hyphens, no 3rd/4th position hyphens
    - **Findings**: [Detailed explanation of hyphen compliance or violations]
    - **Positions**: [Specific positions if violations found]

    **Numeric String Validation**
    - **Result**: ✅ PASS / ❌ ALL_NUMERIC
    - **Analysis**: [Explanation of numeric content assessment]
    - **Rationale**: [Why all-numeric strings are not permitted]

    ### **Tier 1 Compliance Summary**
    **Issues Identified**: [List specific basic compliance issues or state "None - all basic checks passed"]

    **Resolution Required**: [Specific actions needed to address issues or "No action required"]

    ## **🔍 TIER 2 - DNS STABILITY ANALYSIS**

    [If Tier 1 failed: "⚠️ SKIPPED - Tier 1 failures must be resolved before proceeding to stability analysis"]

    ### **Advanced Technical Validation Results**

    **Root Zone Label Generation Rules (RZ-LGR)**
    - **Result**: ✅ COMPLIANT / ⚠️ REVIEW_REQUIRED / ❌ VIOLATION
    - **Analysis**: [Detailed explanation of RZ-LGR compliance]
    - **Script Validation**: [Assessment of character scripts and variants]
    - **Confusables Check**: [Analysis of character confusability issues]

    **RFC 1035 (DNS Name Syntax)**
    - **Result**: ✅ COMPLIANT / ❌ VIOLATION
    - **Analysis**: [Detailed explanation of DNS syntax compliance]
    - **Specific Requirements**: [Which RFC 1035 requirements were validated]
    - **Findings**: [Any syntax issues or compliance confirmations]

    **RFC 1123 (Host Requirements)**
    - **Result**: ✅ COMPLIANT / ❌ VIOLATION
    - **Analysis**: [Detailed explanation of host requirements compliance]
    - **Relaxed Rules**: [Assessment of RFC 1123 relaxed syntax rules]
    - **Findings**: [Any host requirement issues or compliance confirmations]

    **RFC 2181 (DNS Specification)**
    - **Result**: ✅ COMPLIANT / ❌ VIOLATION
    - **Analysis**: [Detailed explanation of DNS specification compliance]
    - **Name Length Limits**: [Assessment of DNS name length requirements]
    - **Findings**: [Any specification issues or compliance confirmations]

    **Protocol Compatibility Assessment**
    - **Result**: ✅ COMPATIBLE / ⚠️ CONCERNS / ❌ INCOMPATIBLE
    - **DNS Software Compatibility**: [Assessment of major DNS software compatibility]
    - **Resolver Issues**: [Analysis of potential DNS resolver problems]
    - **DNSSEC Compatibility**: [Assessment of DNS security extension compatibility]
    - **Findings**: [Specific compatibility issues or confirmations]

    **Character Encoding Validation**
    - **Result**: ✅ VALID / ⚠️ IDN_REQUIRED / ❌ INVALID
    - **UTF-8 Compliance**: [Assessment of character encoding]
    - **Normalization**: [Analysis of Unicode normalization requirements]
    - **Findings**: [Encoding issues or compliance confirmations]

    ### **DNS Stability Risk Assessment**
    **Risk Factors Identified**: [List any stability concerns or state "None identified"]

    **Stability Analysis**: [Detailed explanation of DNS stability implications]

    ## **⚠️ EXPERT REVIEW TRIGGERS**

    ### **IDN Validation Requirements**
    - **IDN Review Required**: [Yes/No]
    - **Reason**: [Non-ASCII characters detected or other IDN considerations]
    - **Next Steps**: [Specific IDN validation requirements]

    ### **Complex Technical Issues**
    - **Issues Identified**: [List complex technical issues or state "None"]
    - **Expert Review Needed**: [Explanation of why expert review is required]
    - **Specialist Required**: [Type of technical specialist needed]

    ### **Standards Compliance Concerns**
    - **Concerns Identified**: [List standards compliance issues or state "None"]
    - **Impact Assessment**: [Explanation of potential impact on DNS stability]
    - **Resolution Path**: [Steps needed to address concerns]

    ## **📋 RECOMMENDATIONS & NEXT STEPS**

    ### **Immediate Actions Required**
    - **Critical Issues**: [Required fixes or state "None required"]
    - **Timeline**: [Urgency of required actions]
    - **Dependencies**: [Any dependencies for issue resolution]

    ### **Expert Review Requirements**
    - **Review Type**: [IDN validation, complex cases, or "Not required"]
    - **Specialist Needed**: [Type of expert required]
    - **Timeline**: [When expert review should occur]

    ### **ICANN Application Readiness**
    - **Technical Readiness**: [Ready/Needs fixes/Requires expert review]
    - **Documentation Needs**: [Additional technical documentation required]
    - **Compliance Certification**: [Status of technical compliance certification]

    ## **🔧 VALIDATION METHODOLOGY & CONFIDENCE**

    ### **Analysis Method**
    - **Validation Approach**: Two-tier technical compliance + DNS stability analysis
    - **Tools Used**: TLD String Analyzer, ICANN Guidebook Search
    - **Standards Referenced**: RFC 1035, RFC 1123, RFC 2181, RZ-LGR
    - **Database Sources**: ICANN technical requirements, DNS specification standards

    ### **ICANN Guidebook References**
    - **Sections Consulted**: [List relevant guidebook sections referenced]
    - **Criteria Applied**: [Specific ICANN evaluation criteria used]
    - **Official Requirements**: [Key official requirements validated against]

    ### **Confidence Assessment**
    - **Analysis Confidence**: High/Medium/Low
    - **Data Quality**: ✅ AUTHORITATIVE SOURCES / ⚠️ PARTIAL DATA
    - **Method Validation**: Conservative technical assessment with expert review triggers
