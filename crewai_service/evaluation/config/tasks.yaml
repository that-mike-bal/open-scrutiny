comprehensive_similarity_analysis:
  description: |
    Conduct comprehensive string characterization and two-phase similarity analysis for TLD string '{tld_string}' against the complete IANA TLD database using the Advanced String Similarity Analyzer tool.

    🔧 ENHANCED APPROACH WITH STRING CHARACTERIZATION:

    **Phase 1: String Characterization & Semantic Analysis**
    - Analyze string meaning, semantic associations, and industry relevance
    - Classify string type (generic, brand, geographic, technical, etc.)
    - Identify target use cases and market positioning
    - Assess cultural and linguistic implications
    - Evaluate technical properties (length, character types, DNS compliance)

    **Phase 2: LLM Semantic Similarity Identification**
    - Use semantic understanding to identify potentially similar strings from IANA database
    - Consider visual, phonetic, and meaning-based similarity

    **Phase 3: Algorithmic Similarity Scoring**
    - Precise algorithmic similarity scoring for identified candidates
    - Multiple scoring methods for comprehensive assessment

    🔧 ENHANCED APPROACH:
    1. FIRST: Characterize the string - meaning, classification, industry relevance
    2. SECOND: Identify and list any TLDs with similarity concerns for '{tld_string}'
    3. THEN: Use Advanced String Similarity Analyzer tool to assess similarity risk levels
    4. PROVIDE: Clear summary showing string characteristics and exactly which TLDs are similar with their similarity scores

