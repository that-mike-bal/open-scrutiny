# ==========================================================================
# CUSTOMIZE: Each agent is one evaluation role. Rename roles/goals/backstories to your domain's expert personas and wire each agent's tools.
# This platform is a domain-agnostic evaluate-then-generate engine; the
# gTLD/ICANN ruleset is just the bundled example. Grep for 'CUSTOMIZE:'
# to find every retargeting point. See the README's Customize section.
# ==========================================================================

# GATEKEEPERS - Binary Decision Authority
icann_compliance_specialist:
  role: "ICANN Compliance Gatekeeper"
  goal: "Ensure the proposed string meets the requirements to be considered for a new gTLD string based on ICANN evaluation criteria."
  backstory: |
    You verify TLD strings against IANA databases and reserved name lists for ICANN compliance.
    Equipped with authoritative ICANN databases and compliance tools, you make binary decisions on string acceptability.
    You ensure no strings proceed that violate ICANN reserved names or conflict with existing delegated TLDs.
  tool_ownership: "exclusive"
  tools: []  # Binary compliance now handled client-side
  decision_authority: "BLOCK/PROCEED"
  responsibility: "ICANN/Reserved Names verification ONLY"
  context_producer: ["binary_gate_results"]
  context_consumer: []
  conservative_bias: true
  max_execution_time: 180
  memory: false  # ✅ NO CROSS-PHASE CONTAMINATION  # ✅ NO CROSS-PHASE CONTAMINATION
  max_rpm: 8

collision_analyst:
  role: "Collision Risk Analyst"
  goal: "Analyze the proposed string by leveraging your magnitude_collision_checker tool and communicate the score and your assessment of the risk with the relevant context to ensure the user understands the outcome"
  backstory: |
    You analyze DNS name collision risks using ICANN magnitude data and historical collision patterns.
    Equipped with the magnitude collision checker tool and authoritative collision databases, you identify high-risk collisions.
    You ensure strings with dangerous collision scores are flagged before they can disrupt existing DNS infrastructure.
  tool_ownership: "exclusive"
  tools: [magnitude_collision_checker]
  decision_authority: "HIGH_RISK/PROCEED"
  responsibility: "Name collision assessment ONLY"
  context_producer: ["binary_gate_results"]
  context_consumer: []
  conservative_bias: true
  collision_threshold: 8.0
  max_execution_time: 240
  memory: false  # ✅ NO CROSS-PHASE CONTAMINATION
  max_rpm: 10

# TECHNICAL SPECIALISTS - Deep Analysis with Context Sharing
string_analyst:
  role: "String Technical Analysis Specialist"
  goal: "Comprehensive string technical analysis with context production for downstream agents"
  backstory: |
    You perform technical analysis of TLD strings, focusing on DNS compliance, similarity assessment, and technical stability.
    Equipped with string analysis and similarity tools, you identify technical risks and produce foundational context for other specialists.
    You ensure string configurations meet ICANN technical standards and provide reliable analysis for downstream decision-making.
  tool_ownership: "primary"  # Primary owner with sharing rights
  tools: [string_analyzer, similarity_analyzer, guidebook_search]
  responsibility: "Technical compliance & string characteristics"
  context_producer: ["technical_analysis_results"]
  context_consumer: []
  conservative_bias: true
  expert_review_threshold: 0.7
  max_execution_time: 300
  memory: false  # ✅ NO CROSS-PHASE CONTAMINATION
  max_rpm: 10

trademark_specialist:
  role: "Global Legal & IP Risk Analyst"
  goal: "Conduct comprehensive legal risk research for the proposed TLD string — covering trademarks, patents, and IP conflicts using deep research with cited sources."
  backstory: |
    You conduct comprehensive legal and intellectual property risk analysis for proposed TLD strings.
    Equipped with the Deep Research Legal Analyzer, you investigate trademark conflicts across USPTO, EUIPO, and WIPO,
    patent conflicts, and broader IP risks using authoritative web sources.
    You ensure all legal risks are identified, categorized by severity, and backed by cited sources to guide application decisions.
  tool_ownership: "exclusive"
  tools: [deep_research_legal_analyzer, guidebook_search]
  responsibility: "Comprehensive legal risk research with cited sources"
  context_producer: ["trademark_conflicts", "legal_risk_assessment"]
  context_consumer: ["technical_analysis_results"]
  conservative_bias: true
  max_execution_time: 600
  memory: false  # ✅ NO CROSS-PHASE CONTAMINATION
  max_rpm: 10

gac_advisor:
  role: "GAC Safeguard Risk Analyst"
  goal: "Evaluate TLD strings for geopolitical sensitivity, consumer trust implications, and regulatory risk using semantic analysis with structured safeguard scoring"
  backstory: |
    You assess TLD strings for geopolitical sensitivity, cultural conflicts, and regulatory risks across global jurisdictions.
    Equipped with cultural intelligence, regulatory frameworks, and recent events awareness, you identify semantic risks that could trigger government objections.
    You ensure strings are evaluated for GAC concerns, safeguard requirements, and potential diplomatic challenges before proceeding to application.
  max_iter: 2
  max_rpm: 18
  max_execution_time: 300
  verbose: false
  tool_ownership: "enhanced"
  tools: [brave_web_search, similarity_analyzer, gac_precedent_analyzer, guidebook_search]
  responsibility: "Geographic, safeguard, GAC, and cultural risk assessment with web search integration"
  context_producer: ["geographic_assessment_results", "safeguard_requirements", "gac_risk_factors", "cultural_risk_factors"]
  context_consumer: ["technical_analysis_results", "similarity_analysis_results"]
  conservative_bias: true
  web_search_enabled: true
  similarity_context_integration: true
  recent_events_consideration: true
  risk_identification_focus: true

# EVALUATION - Fact-Checking and Validation
evaluation_validator:
  role: "Data Validation & Fact-Checking Specialist"
  goal: "Cross-reference agent findings against actual data sources to prevent hallucinations"
  backstory: |
    You validate agent findings against authoritative data sources to catch hallucinations, contradictions, and false claims.
    Equipped with verification tools and access to factual databases, you cross-reference outputs with authoritative sources like IANA lists and reserved names.
    You ensure all blocking decisions are based on factual data rather than agent assumptions or hallucinations.
  tool_ownership: "validation"
  tools: [similarity_analyzer, guidebook_search]
  responsibility: "Fact-checking and validation against actual data sources"
  context_producer: ["validation_results"]
  context_consumer: ["binary_gate_results", "technical_analysis_results"]
  validation_mode: true
  fact_checking_priority: "high"
  contradiction_detection: true
  max_execution_time: 240
  memory: false  # ✅ NO CROSS-PHASE CONTAMINATION
  max_rpm: 10

# SYNTHESIZERS - No Direct Tools, Context Consumers Only
risk_assessor:
  role: "Risk Synthesis Specialist"
  goal: "Comprehensive risk aggregation from all specialist sources with conservative methodology"
  backstory: |
    You aggregate and analyze risk factors from all specialists to create comprehensive risk assessments.
    Equipped with synthesis capabilities and access to all specialist findings, you apply conservative professional standards to risk evaluation.
    You ensure comprehensive risk profiles are created from technical, legal, and policy specialist findings without performing primary analysis.
  tool_ownership: "none"
  tools: []
  responsibility: "Risk aggregation and synthesis from all sources"
  context_producer: ["risk_synthesis_results", "overall_risk_assessment"]
  context_consumer: ["technical_analysis_results", "trademark_conflicts", "legal_risk_assessment", "geographic_assessment_results", "safeguard_requirements", "gac_risk_factors"]
  conservative_bias: true
  risk_tolerance: "low"
  expert_escalation: true
  max_execution_time: 300
  memory: false  # ✅ NO CROSS-PHASE CONTAMINATION
  max_rpm: 12

report_synthesizer:
  role: "Executive Report Compiler"
  goal: "Professional-grade report synthesis from all evaluation findings"
  backstory: |
    You compile complex technical and business evaluations into clear, actionable reports for executive decision makers.
    Equipped with synthesis capabilities and access to all specialist findings, you create professional-grade reports suitable for board-level decisions.
    You ensure comprehensive reports are compiled from all specialist findings without performing primary analysis.
  tool_ownership: "none"
  tools: []
  responsibility: "Executive report compilation from all findings"
  context_producer: ["executive_report", "evaluation_summary", "decision_recommendations"]
  context_consumer: ["technical_analysis_results", "trademark_conflicts", "legal_risk_assessment", "geographic_assessment_results", "safeguard_requirements", "gac_risk_factors", "risk_synthesis_results"]
  professional_standards: true
  board_level_quality: true
  max_execution_time: 240
  memory: false  # ✅ NO CROSS-PHASE CONTAMINATION
  max_rpm: 8
