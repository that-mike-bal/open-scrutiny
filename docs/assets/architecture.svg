<svg width="900" height="770" viewBox="0 0 680 640" xmlns="http://www.w3.org/2000/svg" role="img" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;">
  <title>OpenScrutiny — system architecture</title>
  <desc>A React client with fast local gates writes to a FastAPI backend and reads results from Postgres. The backend builds CrewAI crews from YAML and runs them as sequential workflows of specialist agents, each with its own tools; rubric-scored findings and a per-task audit trail are stored, synthesised into a report, and fed to the generation half.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Legend -->
  <rect x="40" y="18" width="12" height="12" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="58" y="28" font-size="12" fill="#5F5E5A">Client</text>
  <rect x="110" y="18" width="12" height="12" rx="3" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="128" y="28" font-size="12" fill="#5F5E5A">Engine + agents</text>
  <rect x="250" y="18" width="12" height="12" rx="3" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="268" y="28" font-size="12" fill="#5F5E5A">Data</text>

  <!-- Tier 1: Client -->
  <rect x="40" y="52" width="600" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="340" y="72" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">React client</text>
  <text x="340" y="92" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">submit items · fast local gates reject obvious failures before any model call</text>

  <!-- Arrows: client writes to the API, reads results from the database -->
  <line x1="175" y1="108" x2="175" y2="162" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="163" y="140" text-anchor="end" font-size="12" fill="#5F5E5A">writes</text>

  <line x1="505" y1="108" x2="505" y2="162" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="517" y="140" text-anchor="start" font-size="12" fill="#5F5E5A">live reads</text>

  <!-- Tier 2: API + database -->
  <rect x="40" y="164" width="280" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="180" y="184" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">FastAPI backend</text>
  <text x="180" y="204" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">one evaluation at a time · 409 when busy</text>

  <rect x="380" y="164" width="260" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="510" y="184" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">Postgres (Supabase)</text>
  <text x="510" y="204" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">items · task results · audit trail · RAG index</text>

  <!-- Arrow: backend persists to the database -->
  <line x1="320" y1="192" x2="378" y2="192" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="349" y="184" text-anchor="middle" font-size="12" fill="#5F5E5A">persists</text>

  <!-- L-path: backend builds crews -->
  <path d="M180 220 L180 246 L340 246 L340 270" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Tier 3: crews built from YAML -->
  <rect x="40" y="272" width="600" height="130" rx="12" stroke-width="0.5" stroke-dasharray="4 3" fill="none" stroke="#888780"/>
  <text x="340" y="296" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3d3d3a">CrewAI crews built from YAML — agents · tasks · tools · workflows</text>

  <rect x="60" y="314" width="170" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="145" y="334" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">Workflow 1</text>
  <text x="145" y="354" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">specialists → gut check</text>

  <rect x="255" y="314" width="170" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="340" y="334" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">Workflow 2</text>
  <text x="340" y="354" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">specialists → gut check</text>

  <rect x="450" y="314" width="170" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="535" y="334" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">Workflow N</text>
  <text x="535" y="354" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">specialists → gut check</text>

  <!-- Sequential arrows between workflows -->
  <line x1="230" y1="342" x2="253" y2="342" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="425" y1="342" x2="448" y2="342" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Arrow: crews call tools -->
  <line x1="340" y1="402" x2="340" y2="436" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Tier 4: tools -->
  <rect x="40" y="438" width="600" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="340" y="458" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">Tools, owned per agent</text>
  <text x="340" y="478" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">local datasets · external APIs (web search, deep research) · RAG over a reference corpus</text>

  <!-- Arrow: tools feed findings -->
  <line x1="340" y1="494" x2="340" y2="528" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Tier 5: findings and deliverables -->
  <rect x="120" y="530" width="440" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="340" y="550" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">Rubric-scored findings + per-task audit trail</text>
  <text x="340" y="570" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">→ synthesised report → generated deliverables</text>
</svg>
